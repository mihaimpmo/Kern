# Limine bootloader configuration
timeout: 3

/Kern
    protocol: limine
    path: boot():/boot/kernel
    module_path: boot():/boot/bin/init.elf
    module_path: boot():/boot/bin/hello.elf
    module_path: boot():/boot/bin/spin.elf
    module_path: boot():/boot/bin/crash.elf
    module_path: boot():/boot/bin/selftest.elf
